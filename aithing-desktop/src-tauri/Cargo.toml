[package]
name = "aithing-desktop"
version = "1.0.0"
description = "AI-powered assistant for macOS and Windows"
authors = ["AIThing"]
edition = "2021"

[lib]
name = "aithing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
